name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: llm-shell

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: llm-shell/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Unit tests
        run: npm test

      - name: UI e2e (mock LLM)
        run: npm run test:e2e-ui

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: llm-shell/package-lock.json

      - name: Install frontend deps (for tauri build graph)
        run: npm ci
        working-directory: llm-shell

      - name: Cargo test
        run: cargo test
        working-directory: llm-shell/src-tauri

      - name: Cargo check
        run: cargo check
        working-directory: llm-shell/src-tauri
